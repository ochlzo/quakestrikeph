x-worker-environment: &worker-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  PHIVOLCS_CATALOG_URL: ${PHIVOLCS_CATALOG_URL:?Set PHIVOLCS_CATALOG_URL in .env}
  MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-20000000}
  MODEL_RELEASE_ID: ${MODEL_RELEASE_ID:?Set MODEL_RELEASE_ID in .env}
  MODEL_ARTIFACT_DIRECTORY: /app/model-artifacts
  BOOTSTRAP_RUN_MANIFEST: /app/bootstrap-snapshots/bootstrap-readiness.json
  BOOTSTRAP_REQUIRED_AVAILABLE_THROUGH: ${BOOTSTRAP_REQUIRED_AVAILABLE_THROUGH:?Set BOOTSTRAP_REQUIRED_AVAILABLE_THROUGH in .env}
  POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
  DISPATCHER_POLL_INTERVAL_SECONDS: ${DISPATCHER_POLL_INTERVAL_SECONDS:-5}
  DETAIL_REQUEST_CONCURRENCY: ${DETAIL_REQUEST_CONCURRENCY:-4}

x-worker-volumes: &worker-volumes
  - ${MODEL_ARTIFACT_HOST_DIRECTORY:-../model-artifacts}:/app/model-artifacts:ro
  - ../bootstrap-snapshots:/app/bootstrap-snapshots:ro

x-worker-logging: &worker-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  release-init:
    profiles: ["init"]
    image: quakestrike-workers:${WORKER_IMAGE_TAG:?Set WORKER_IMAGE_TAG to the tested Git commit SHA}
    command: ["quakestrike", "config-check"]
    environment:
      <<: *worker-environment
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in .env}
    volumes:
      - ${MODEL_ARTIFACT_HOST_DIRECTORY:-../model-artifacts}:/app/model-artifacts:ro
      - ../bootstrap-snapshots:/app/bootstrap-snapshots
    networks: [private-data]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *worker-logging

  dispatcher:
    image: quakestrike-workers:${WORKER_IMAGE_TAG:?Set WORKER_IMAGE_TAG to the tested Git commit SHA}
    command: ["quakestrike-dispatcher"]
    environment:
      <<: *worker-environment
      ALERT_RESOLUTION_ENABLED: ${ALERT_RESOLUTION_ENABLED:-false}
    volumes: *worker-volumes
    networks: [private-data]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-dev", "--no-sync", "python", "-m", "quakestrike.operator_runtime", "health-dispatcher"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m
    logging: *worker-logging

  data-ingestor:
    image: quakestrike-workers:${WORKER_IMAGE_TAG:?Set WORKER_IMAGE_TAG to the tested Git commit SHA}
    command: ["quakestrike-ingestor"]
    environment: *worker-environment
    volumes: *worker-volumes
    networks: [private-data, source-egress]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-dev", "--no-sync", "python", "-m", "quakestrike.operator_runtime", "health-ingestor"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 512m
    logging: *worker-logging

  prediction-worker:
    profiles: ["prediction"]
    image: quakestrike-prediction:${WORKER_IMAGE_TAG:?Set WORKER_IMAGE_TAG to the tested Git commit SHA}
    command: ["quakestrike-prediction"]
    environment:
      <<: *worker-environment
      PREDICTION_SOFT_TIME_LIMIT_SECONDS: ${PREDICTION_SOFT_TIME_LIMIT_SECONDS:-300}
      PREDICTION_HARD_TIME_LIMIT_SECONDS: ${PREDICTION_HARD_TIME_LIMIT_SECONDS:-360}
      PUBLIC_BULLETIN_BASE_URL: ${PUBLIC_BULLETIN_BASE_URL:-https://quakestrikeph.com}
    volumes: *worker-volumes
    networks: [private-data]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-dev", "--no-sync", "python", "-m", "quakestrike.operator_runtime", "health-prediction"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 512m
    logging: *worker-logging

  alert-worker:
    profiles: ["alerts"]
    image: quakestrike-workers:${WORKER_IMAGE_TAG:?Set WORKER_IMAGE_TAG to the tested Git commit SHA}
    command: ["quakestrike-alert"]
    environment:
      <<: *worker-environment
      ALERT_RESOLUTION_ENABLED: ${ALERT_RESOLUTION_ENABLED:-false}
      ALERT_DELIVERY_ENABLED: ${ALERT_DELIVERY_ENABLED:-false}
      IPROG_API_TOKEN: ${IPROG_API_TOKEN:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-}
    volumes: *worker-volumes
    networks: [private-data, source-egress]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-dev", "--no-sync", "python", "-m", "quakestrike.operator_runtime", "health-alert"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 512m
    logging: *worker-logging

  alert-reconciliation:
    profiles: ["alerts"]
    image: quakestrike-workers:${WORKER_IMAGE_TAG:?Set WORKER_IMAGE_TAG to the tested Git commit SHA}
    command: ["quakestrike-alert-reconcile"]
    environment:
      <<: *worker-environment
      ALERT_DELIVERY_ENABLED: ${ALERT_DELIVERY_ENABLED:-false}
      ALERT_RECONCILIATION_INTERVAL_SECONDS: ${ALERT_RECONCILIATION_INTERVAL_SECONDS:-5}
      ALERT_RECONCILIATION_BATCH_SIZE: ${ALERT_RECONCILIATION_BATCH_SIZE:-20}
      IPROG_API_TOKEN: ${IPROG_API_TOKEN:-}
    volumes: *worker-volumes
    networks: [private-data, source-egress]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-dev", "--no-sync", "python", "-m", "quakestrike.operator_runtime", "health-alert-reconciliation"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 256m
    logging: *worker-logging

  beat:
    profiles: ["beat"]
    image: quakestrike-workers:${WORKER_IMAGE_TAG:?Set WORKER_IMAGE_TAG to the tested Git commit SHA}
    command: ["quakestrike-beat"]
    environment: *worker-environment
    volumes: *worker-volumes
    networks: [private-data]
    depends_on:
      dispatcher:
        condition: service_healthy
      data-ingestor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-dev", "--no-sync", "python", "-m", "quakestrike.operator_runtime", "health-beat"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    mem_limit: 512m
    logging: *worker-logging

networks:
  source-egress:
