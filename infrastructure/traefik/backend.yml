http:
  routers:
    backend-api:
      entryPoints: [web]
      rule: Host(`quakestrikeph.qzz.io`) && PathPrefix(`/api/v1/`)
      priority: 100
        bulletin:
      entryPoints: [web]
      rule: Host(`quakestrikeph.qzz.io`)
      priority: 10
      service: bulletin
  middlewares: [public-api-limit]
      service: backend-api
    bulletin:
      entryPoints: [web]
      rule: Host(`quakestrikeph.qzz.io`)
      priority: 10
      service: bulletin
  middlewares:
    public-api-limit:
      rateLimit:
        average: 60
        period: 1m
        burst: 20
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP
  services:
    bulletin:
      loadBalancer:
        servers:
          - url: http://bulletin:4321
    backend-api:
      loadBalancer:
        servers:
          - url: http://backend-api:3000
