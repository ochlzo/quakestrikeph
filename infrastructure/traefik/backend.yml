http:
  routers:
    forecast-simulations:
      entryPoints: [web]
      rule: Host(`quakestrikeph.com`) && Path(`/api/v1/forecast-simulations`)
      priority: 110
      middlewares: [public-api-limit, simulation-ingress]
      service: backend-api
    backend-api:
      entryPoints: [web]
      rule: Host(`quakestrikeph.com`) && PathPrefix(`/api/v1/`)
      priority: 100
      middlewares: [public-api-limit]
      service: backend-api
    bulletin:
      entryPoints: [web]
      rule: Host(`quakestrikeph.com`)
      priority: 10
      service: bulletin
  middlewares:
    simulation-ingress:
      headers:
        customRequestHeaders:
          X-Simulation-Ingress: '{{ env "SIMULATION_INGRESS_KEY" }}'
    public-api-limit:
      rateLimit:
        average: 60
        period: 1m
        burst: 20
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP
  services:
    bulletin:
      loadBalancer:
        servers:
          - url: http://bulletin:4321
    backend-api:
      loadBalancer:
        servers:
          - url: http://backend-api:3000
