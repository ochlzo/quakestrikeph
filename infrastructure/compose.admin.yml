services:
  observer-init:
    profiles: ["admin"]
    image: postgres:16.15-bookworm
    command: ["sh", "/opt/quakestrike/provision-roles.sh", "create-observer"]
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quakestrike}
      POSTGRES_USER: ${POSTGRES_USER:-quakestrike}
      OBSERVER_DB_PASSWORD: ${OBSERVER_DB_PASSWORD:?Set OBSERVER_DB_PASSWORD in .env}
    volumes:
      - ./postgres/provision-roles.sh:/opt/quakestrike/provision-roles.sh:ro
    networks:
      - private-data
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    profiles: ["admin"]
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - private-data
      - admin-access
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgadmin_data:

networks:
  admin-access:
