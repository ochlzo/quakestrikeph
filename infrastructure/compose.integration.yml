services:
  postgres-test:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: quakestrike_test
      POSTGRES_USER: quakestrike_test
      POSTGRES_PASSWORD: integration-only
    volumes:
      - phase2_postgres_data:/var/lib/postgresql/data
    networks:
      - phase2-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quakestrike_test -d quakestrike_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  test-runner:
    build:
      context: ..
      dockerfile: workers/Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://quakestrike_test:integration-only@postgres-test:5432/quakestrike_test
    networks:
      - phase2-test
    depends_on:
      postgres-test:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  phase2_postgres_data:

networks:
  phase2-test:
    internal: true
