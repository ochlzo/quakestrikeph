name: quakestrike-data-ingestion-test

services:
  postgres-test:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: quakestrike_test
      POSTGRES_USER: quakestrike_test
      POSTGRES_PASSWORD: integration-only
      BACKEND_DB_PASSWORD: integration-only
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../database/initialization:/opt/quakestrike:ro
    networks:
      - phase2-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quakestrike_test -d quakestrike_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  redis-test:
    image: redis:7.4.11-bookworm
    networks:
      - phase2-test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  test-runner:
    build:
      context: ..
      dockerfile: workers/Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://quakestrike_test:integration-only@postgres-test:5432/quakestrike_test
      TEST_REDIS_URL: redis://redis-test:6379/0
    networks:
      - phase2-test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  backend-test-runner:
    profiles: ["backend"]
    build:
      context: ..
      dockerfile: apps/backend-api/Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql://quakestrike_test:integration-only@postgres-test:5432/quakestrike_test
      TEST_REDIS_URL: redis://redis-test:6379/0
      TEST_BACKEND_DATABASE_URL: postgresql://quakestrike_backend:integration-only@postgres-test:5432/quakestrike_test
    networks:
      - phase2-test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  prediction-smoke-runner:
    profiles: ["prediction-smoke"]
    build:
      context: ..
      dockerfile: workers/Dockerfile.test
      args:
        TEST_EXTRA: prediction
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://quakestrike_test:integration-only@postgres-test:5432/quakestrike_test
      TEST_REDIS_URL: redis://redis-test:6379/0
      MODEL_ARTIFACT_DIRECTORY: /workspace/model-artifacts
    volumes:
      - ${MODEL_ARTIFACT_HOST_DIRECTORY:-../model-artifacts}:/workspace/model-artifacts:ro
    networks:
      - phase2-test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

networks:
  phase2-test:
    internal: true
