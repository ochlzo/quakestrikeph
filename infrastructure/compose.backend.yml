services:
  backend-api:
    image: quakestrike-backend:${BACKEND_IMAGE_TAG:?Set BACKEND_IMAGE_TAG to the tested Git commit SHA}
    build:
      context: ..
      dockerfile: apps/backend-api/Dockerfile
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      ACCOUNT_REDIS_URL: ${ACCOUNT_REDIS_URL:-redis://redis:6379/0}
      ALERT_TEST_REDIS_URL: ${ALERT_TEST_REDIS_URL:-}
      IPROG_API_TOKEN: ${IPROG_API_TOKEN:-}
      BREVO_CALLBACK_TOKEN: ${BREVO_CALLBACK_TOKEN:-}
      DATABASE_URL: ${BACKEND_DATABASE_URL:?Set BACKEND_DATABASE_URL in .env}
      MODEL_RELEASE_ID: ${MODEL_RELEASE_ID:?Set MODEL_RELEASE_ID in .env}
      PORT: "3000"
      DB_POOL_SIZE: "5"
      DB_QUERY_TIMEOUT_MS: "3000"
    networks: [private-data, backend-edge]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

networks:
  backend-edge:
