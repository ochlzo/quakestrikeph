openapi: 3.1.0
info:
  title: QuakeStrike PH Bulletin API
  version: 1.0.0
  description: Public earthquake information, guest forecast simulations, and authenticated owner-only account settings.
servers:
  - url: https://quakestrikeph.com/api/v1
    description: Primary public domain.
paths:
  /earthquakes/search:
    post:
      operationId: searchEarthquakes
      summary: Search the latest revision of each non-superseded earthquake
      description: POST carries filters only; this operation does not write data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Matching earthquakes, newest earthquake time first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /earthquakes/{eventId}:
    get:
      operationId: getEarthquake
      summary: Get the latest revision of one non-superseded earthquake
      parameters:
        - name: test
          in: query
          description: Select immutable submitted synthetic data. Never falls back to production. Responses use Cache-Control no-store.
          schema:
            type: string
            enum: ['true']
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Earthquake and current forecast, if available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /earthquakes/{eventId}/observations:
    post:
      operationId: searchSyntheticObservations
      summary: Read saved synthetic observations within one active session
      description: Returns all observation kinds without distance or magnitude filters. Reads never generate data or queue work. Responses use Cache-Control no-store.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: test
          in: query
          required: true
          schema:
            type: string
            enum: ['true']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyntheticObservationRequest'
      responses:
        '200':
          description: Saved observations, newest first, including background and spillover
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /forecast-simulations:
    post:
      operationId: runForecastSimulation
      summary: Run a guest forecast simulation synchronously
      x-status: draft
      description: >-
        Returns a 24-hour SEIS 1.0.1 forecast using the latest qualifying PHIVOLCS cutoff.
        Bulletin fetches catalog status through an internal Backend call when it renders
        /simulate-forecast. The Backend validates the cookie and scenario, rechecks catalog
        eligibility, and checks both quotas and capacity. Model start charges both quotas.
      externalDocs:
        description: Issue #83 feature requirements
        url: https://github.com/ochlzo/quakestrikeph/issues/83
      security: [{ForecastSimulationGuest: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastSimulationScenario'
            example: {latitude: 14.5995, longitude: 120.9842, magnitude: 5.2, depthKm: 18}
      responses:
        '200':
          description: A completed simulation for the submitted scenario.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SimulationCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastSimulationResult'
              example:
                scenario: {latitude: 14.5995, longitude: 120.9842, magnitude: 5.2, depthKm: 18}
                catalogCutoff: '2026-11-19T02:30:00Z'
                forecast:
                  windowStart: '2026-11-19T02:30:00Z'
                  windowEnd: '2026-11-20T02:30:00Z'
                  probabilityM1Plus24h: 0.82
                  probabilityM4Plus24h: 0.17
                  probabilityM5Plus24h: 0.04
                  expectedM1PlusCount24h: 3.4
                  maximumMagnitudeQ05_24h: 1.3
                  maximumMagnitudeQ50_24h: 2.8
                  maximumMagnitudeQ95_24h: 4.7
                  activityRadiusMedianKm24h: null
        '400':
          description: Invalid JSON or invalid scenario. Neither quota was charged.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SimulationCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidSimulationRequest'
              examples:
                invalidField:
                  value:
                    error: {code: INVALID_REQUEST, field: depthKm, message: Enter a depth between 0 and 700 km.}
                invalidJson:
                  value:
                    error: {code: INVALID_JSON, message: Request body must be valid JSON.}
        '403':
          description: Missing, invalid, or expired guest cookie. Reload /simulate-forecast before retrying. Neither quota was charged.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SimulationCacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: {type: string, const: SIMULATION_GUEST_COOKIE_REQUIRED}
                      message: {type: string}
              example:
                error: {code: SIMULATION_GUEST_COOKIE_REQUIRED, message: Confirm the guest cookie before running a simulation.}
        '413':
          description: Request body exceeds 8 KiB. Neither quota was charged.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SimulationCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: PAYLOAD_TOO_LARGE, message: Request body is too large.}
        '429':
          description: >-
            One or both simulation quotas are full. This request uses neither quota.
            The Backend returns retryAt and Retry-After based on current usage.
            The edge can also return its own 429 without this JSON body or retry deadline.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SimulationCacheControl'
            Retry-After:
              description: Seconds from the Backend response until retryAt, rounded up to a whole second.
              schema: {type: integer, minimum: 0}
              example: 180
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationLimitReached'
              example:
                error: {code: SIMULATION_LIMIT_REACHED, message: Simulation limit reached., retryAt: '2026-11-19T02:38:00Z'}
        '503':
          description: The Backend could not admit the run. Neither quota was charged.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SimulationCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationUnavailable'
              examples:
                busy:
                  value:
                    error: {code: SIMULATION_BUSY, message: All simulation slots are busy.}
                quotaUnavailable:
                  value:
                    error: {code: SIMULATION_QUOTA_UNAVAILABLE, message: Simulation limits could not be checked.}
                insufficientHistory:
                  value:
                    error: {code: SIMULATION_HISTORY_INSUFFICIENT, message: Seven continuous days of verified PHIVOLCS records are unavailable.}
                historyTooOld:
                  value:
                    error: {code: SIMULATION_HISTORY_TOO_OLD, message: The latest qualifying PHIVOLCS cutoff is more than seven weeks old., catalogCutoff: '2026-09-30T02:30:00Z'}
                catalogUnavailable:
                  value:
                    error: {code: SIMULATION_CATALOG_UNAVAILABLE, message: The PHIVOLCS catalog could not be checked.}
        '500':
          description: >-
            SIMULATION_MODEL_FAILED confirms that model execution started and failed. Both
            quotas were charged. INTERNAL_ERROR makes no guarantee about whether the model started.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SimulationCacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: {type: string, enum: [SIMULATION_MODEL_FAILED, INTERNAL_ERROR]}
                      message: {type: string}
              example:
                error: {code: SIMULATION_MODEL_FAILED, message: The model started but could not complete the forecast.}
        '504':
          description: >-
            The Backend timed out and cannot confirm whether execution started.
            An ingress timeout can occur without the Backend JSON body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SimulationCacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: {type: string, const: SIMULATION_OUTCOME_UNKNOWN}
                      message: {type: string}
              example:
                error: {code: SIMULATION_OUTCOME_UNKNOWN, message: The run timed out before its outcome could be confirmed.}
  /account:
    get:
      operationId: getAccount
      security: [{ClerkSession: []}]
      responses:
        '200':
          description: Successful owner-only operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountState'
        default:
          description: Authentication, validation, state or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountError'
  /account/profile:
    put:
      operationId: saveProfile
      security: [{ClerkSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Successful owner-only operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          description: Authentication, validation, state or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountError'
  /account/preferences:
    put:
      operationId: savePreferences
      security: [{ClerkSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Successful owner-only operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          description: Authentication, validation, state or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountError'
  /account/phone:
    delete:
      operationId: removePhone
      security: [{ClerkSession: []}]
      responses:
        '200':
          description: Successful owner-only operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          description: Authentication, validation, state or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountError'
  /account/phone/attempts:
    post:
      operationId: startPhoneVerification
      security: [{ClerkSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
      responses:
        '201':
          description: Successful owner-only operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingPhone'
        default:
          description: Authentication, validation, state or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountError'
    delete:
      operationId: cancelPhoneVerification
      security: [{ClerkSession: []}]
      responses:
        '204':
          description: Successful owner-only operation
        default:
          description: Authentication, validation, state or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountError'
  /account/phone/verify:
    post:
      operationId: verifyPhone
      security: [{ClerkSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneProof'
      responses:
        '200':
          description: Successful owner-only operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          description: Authentication, validation, state or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountError'
components:
  securitySchemes:
    ClerkSession:
      type: http
      scheme: bearer
      bearerFormat: Clerk session JWT
    ForecastSimulationGuest:
      type: apiKey
      in: cookie
      name: qs_guest
      description: >-
        Host-only cookie with Path=/, Secure, HttpOnly, SameSite=Lax, and a fixed 24-hour
        lifetime (Max-Age=86400). If the cookie is missing or invalid, /simulate-forecast
        issues one and redirects once. If the browser still sends no valid cookie, the page
        shows cookie help and keeps Submit disabled. The page and redirect use Cache-Control no-store.
  headers:
    SimulationCacheControl:
      required: true
      description: All simulation responses from the Backend use no-store.
      schema: {type: string, const: no-store}
  responses:
    InvalidRequest:
      description: Invalid filter or event identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Search body exceeds 8 KiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Request limit exceeded at the edge
    NotFound:
      description: No public earthquake with this ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Database unavailable or query timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ForecastSimulationScenario:
      type: object
      additionalProperties: false
      required: [latitude, longitude, magnitude, depthKm]
      description: >-
        The coordinate limits are the inclusive Bulletin map bounds and include offshore points.
        Magnitude and depth are subject to any narrower documented SEIS 1.0.1 limits.
      properties:
        latitude: {type: number, minimum: 0, maximum: 26}
        longitude: {type: number, minimum: 110, maximum: 135}
        magnitude: {type: number, minimum: 1, maximum: 10}
        depthKm: {type: number, minimum: 0, maximum: 700}
    ForecastSimulationResult:
      type: object
      required: [scenario, catalogCutoff, forecast]
      properties:
        scenario:
          $ref: '#/components/schemas/ForecastSimulationScenario'
        catalogCutoff:
          type: string
          format: date-time
          description: Exact UTC cutoff used for this run. This is the hypothetical earthquake time.
        forecast:
          $ref: '#/components/schemas/SimulatedForecast'
    SimulatedForecast:
      type: object
      description: >-
        The probabilities describe the chance of at least one earthquake of each magnitude
        threshold or higher during the window. M5+ is at most M4+, which is at most M1+.
        Magnitude quantiles describe the largest earthquake if M1+ activity occurs. They
        are either all null or ordered from q05 through q95. Null means unavailable.
      required: [windowStart, windowEnd, probabilityM1Plus24h, probabilityM4Plus24h, probabilityM5Plus24h,
        expectedM1PlusCount24h, maximumMagnitudeQ05_24h, maximumMagnitudeQ50_24h,
        maximumMagnitudeQ95_24h, activityRadiusMedianKm24h]
      properties:
        windowStart:
          type: string
          format: date-time
          description: Same instant as catalogCutoff, in UTC.
        windowEnd:
          type: string
          format: date-time
          description: Exactly 24 elapsed hours after windowStart, in UTC.
        probabilityM1Plus24h: {type: number, minimum: 0, maximum: 1}
        probabilityM4Plus24h: {type: number, minimum: 0, maximum: 1}
        probabilityM5Plus24h: {type: number, minimum: 0, maximum: 1}
        expectedM1PlusCount24h: {type: number, minimum: 0}
        maximumMagnitudeQ05_24h: {type: [number, 'null']}
        maximumMagnitudeQ50_24h: {type: [number, 'null']}
        maximumMagnitudeQ95_24h: {type: [number, 'null']}
        activityRadiusMedianKm24h:
          type: [number, 'null']
          minimum: 0
          description: Median activity spread in kilometres from the submitted epicenter if M1+ activity occurs.
    InvalidSimulationRequest:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [INVALID_JSON, INVALID_REQUEST]}
            message: {type: string}
            field:
              type: string
              enum: [latitude, longitude, magnitude, depthKm]
              description: Present when the validation issue identifies a scenario field.
    SimulationLimitReached:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryAt]
          properties:
            code: {type: string, const: SIMULATION_LIMIT_REACHED}
            message: {type: string}
            retryAt:
              type: string
              format: date-time
              description: >-
                Earliest UTC instant when both rolling limits allow another start based on
                current usage. The Backend checks both limits again on retry.
    SimulationUnavailable:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  enum: [SIMULATION_BUSY, SIMULATION_QUOTA_UNAVAILABLE, SIMULATION_HISTORY_INSUFFICIENT,
                    SIMULATION_CATALOG_UNAVAILABLE]
                message: {type: string}
            - type: object
              required: [code, message, catalogCutoff]
              properties:
                code: {type: string, const: SIMULATION_HISTORY_TOO_OLD}
                message: {type: string}
                catalogCutoff: {type: string, format: date-time}
    Preferences:
      type: object
      required: [emailEnabled, smsEnabled, magnitude, nearbyOnly, latitude, longitude, distanceKm]
      properties:
        emailEnabled: {type: boolean}
        smsEnabled: {type: boolean}
        magnitude: {type: number, minimum: 1, maximum: 10, multipleOf: 0.1}
        nearbyOnly: {type: boolean}
        latitude: {type: [number, 'null'], minimum: -90, maximum: 90}
        longitude: {type: [number, 'null'], minimum: -180, maximum: 180}
        distanceKm: {type: [integer, 'null'], minimum: 1, maximum: 1000}
    Account:
      allOf:
        - $ref: '#/components/schemas/Preferences'
        - type: object
          required: [userId, displayName, email, phone, onboardingCompleted, status]
          properties:
            userId: {type: string, format: uuid}
            displayName: {type: string, minLength: 1, maxLength: 100}
            email: {type: string, format: email}
            phone: {type: [string, 'null']}
            onboardingCompleted: {type: boolean}
            status: {type: string, enum: [active, suspended, closed]}
    PendingPhone:
      type: object
      required: [id, phone, expiresAt, resendAt]
      properties:
        id: {type: string, format: uuid}
        phone: {type: string}
        expiresAt: {type: string, format: date-time}
        resendAt: {type: string, format: date-time}
    AccountState:
      type: object
      required: [account, pending, nextStep, deliveryAvailable]
      properties:
        account:
          anyOf:
            - $ref: '#/components/schemas/Account'
            - type: 'null'
        pending:
          anyOf:
            - $ref: '#/components/schemas/PendingPhone'
            - type: 'null'
        nextStep: {type: string, enum: [profile, channels, verify-phone, preferences, complete]}
        deliveryAvailable: {type: boolean, const: false}
    ProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 100}
    PhoneRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: {type: string}
    PhoneProof:
      type: object
      additionalProperties: false
      required: [attemptId, code]
      properties:
        attemptId: {type: string, format: uuid}
        code: {type: string, pattern: '^[0-9]{6}$'}
    AccountError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            field: {type: string}
    MagnitudeRange:
      type: object
      description: Lower bound is inclusive; upper bound is exclusive. At least one bound is required.
      additionalProperties: false
      anyOf:
        - required: [from]
        - required: [below]
      properties:
        from:
          type: number
        below:
          type: number
    SearchRequest:
      type: object
      additionalProperties: false
      properties:
        magnitudeRanges:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/MagnitudeRange'
        dateFrom:
          type: string
          format: date-time
          description: Inclusive earthquake time; an explicit UTC offset is required.
        dateTo:
          type: string
          format: date-time
          description: Exclusive earthquake time; an explicit UTC offset is required.
        location:
          type: string
          minLength: 2
          maxLength: 100
          description: Case-insensitive literal substring of the latest location description.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        cursor:
          type: string
          description: Opaque nextCursor from a previous search with the same filters and limit.
    ForecastSummary:
      type: object
      required: [forecastId, windowStart, windowEnd, expired, probabilityM4Plus24h, probabilityM5Plus24h]
      properties:
        forecastId:
          type: string
          format: uuid
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        expired:
          type: boolean
        probabilityM4Plus24h:
          type: number
        probabilityM5Plus24h:
          type: number
    Forecast:
      allOf:
        - $ref: '#/components/schemas/ForecastSummary'
        - type: object
          required: [modelReleaseId, probabilityM1Plus24h, expectedM1PlusCount24h,
            activityRadiusMedianKm24h, maximumMagnitudeQ05_24h,
            maximumMagnitudeQ50_24h, maximumMagnitudeQ95_24h]
          properties:
            modelReleaseId:
              type: string
              format: uuid
            probabilityM1Plus24h:
              type: number
            expectedM1PlusCount24h:
              type: number
            activityRadiusMedianKm24h:
              type: [number, 'null']
            maximumMagnitudeQ05_24h:
              type: [number, 'null']
            maximumMagnitudeQ50_24h:
              type: [number, 'null']
            maximumMagnitudeQ95_24h:
              type: [number, 'null']
    EarthquakeSummary:
      type: object
      required: [eventId, eventTime, magnitude, latitude, longitude, depthKm,
        locationDescription, forecast]
      properties:
        eventId:
          type: string
          format: uuid
        eventTime:
          type: string
          format: date-time
        magnitude:
          type: number
        latitude:
          type: number
        longitude:
          type: number
        depthKm:
          type: number
        locationDescription:
          type: string
        forecast:
          oneOf:
            - $ref: '#/components/schemas/ForecastSummary'
            - type: 'null'
    ForecastAvailability:
      type: object
      description: >-
        Availability for the latest event revision and configured model release.
        An existing forecast takes priority over prediction jobs and recorded skip reasons.
        Processing includes pending, running, and retrying work; it does not guarantee completion.
        Technical errors remain private. Reasons apply only to unavailable forecasts.
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [available, processing, failed, unavailable]
        reason:
          type: [string, 'null']
          enum: [insufficient_history, below_minimum_magnitude, model_unavailable, unknown, null]
    EarthquakeDetail:
      allOf:
        - $ref: '#/components/schemas/EarthquakeSummary'
        - type: object
          required: [eventRevisionId, origin, source, forecast, forecastAvailability]
          properties:
            eventRevisionId:
              type: string
              format: uuid
            origin:
              type: [string, 'null']
            forecastAvailability:
              $ref: '#/components/schemas/ForecastAvailability'
            source:
              type: object
              required: [provider, url]
              properties:
                provider:
                  const: PHIVOLCS
                url:
                  type: string
                  format: uri
            forecast:
              oneOf:
                - $ref: '#/components/schemas/Forecast'
                - type: 'null'
    SearchResponse:
      type: object
      required: [items, hasMore, nextCursor, fetchedAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EarthquakeSummary'
        hasMore:
          type: boolean
        nextCursor:
          type: [string, 'null']
        fetchedAt:
          type: string
          format: date-time
    SyntheticObservationRequest:
      type: object
      additionalProperties: false
      required: [dateFrom, dateTo]
