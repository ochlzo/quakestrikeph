name: Worker, Backend, and Bulletin checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.32"

      - name: Install worker dependencies
        run: |
          uv python install 3.12
          uv sync --project workers --frozen

      - name: Run unit tests
        run: uv run --project workers pytest --config-file workers/pyproject.toml workers/tests/unit

      - name: Check Python style
        run: |
          uv run --project workers ruff check workers database infrastructure/scripts/save-release-tags.py infrastructure/scripts/cleanup-release-images.py infrastructure/scripts/server-transfer.py infrastructure/scripts/smoke-alert-testing-package.py infrastructure/tests
          uv run --project workers ruff format --check workers database infrastructure/scripts/save-release-tags.py infrastructure/scripts/cleanup-release-images.py infrastructure/scripts/server-transfer.py infrastructure/scripts/smoke-alert-testing-package.py infrastructure/tests

      - name: Check deployment scripts
        run: |
          for script in infrastructure/scripts/*.sh database/initialization/*.sh database/maintenance/*.sh; do
            bash -n "$script"
          done

      - name: Check server recovery safeguards and disposable volume restoration
        run: python3 -m unittest discover -s infrastructure/tests -v

      - name: Check local Compose isolation
        run: python3 infrastructure/scripts/check-local-compose.py

      - name: Start isolated test services
        run: docker compose -p quakestrike-data-ingestion-test -f infrastructure/compose.integration.yml up -d --wait postgres-test redis-test

      - name: Run integration tests
        run: docker compose -p quakestrike-data-ingestion-test -f infrastructure/compose.integration.yml run --build --rm test-runner pytest --config-file workers/pyproject.toml workers/tests/integration

      - name: Provision restricted Backend test login
        run: docker compose -p quakestrike-data-ingestion-test -f infrastructure/compose.integration.yml exec -T postgres-test sh /opt/quakestrike/provision-roles.sh create-backend

      - name: Run Backend integration tests
        run: docker compose -p quakestrike-data-ingestion-test -f infrastructure/compose.integration.yml run --build --rm backend-test-runner

      - name: Start disposable alert-testing Backend fixture
        run: docker compose -p quakestrike-data-ingestion-test -f infrastructure/compose.integration.yml --profile alert-testing-workflow up --build -d --wait alert-testing-backend-fixture

      - name: Verify complete private alert-testing workflow
        run: docker compose -p quakestrike-data-ingestion-test -f infrastructure/compose.integration.yml run --rm -e TEST_ALERT_BACKEND_URL=http://alert-testing-backend-fixture:3000 test-runner pytest --config-file workers/pyproject.toml workers/tests/release/test_alert_testing_workflow.py

      - name: Remove isolated test services
        if: always()
        run: docker compose -p quakestrike-data-ingestion-test -f infrastructure/compose.integration.yml --profile alert-testing-workflow down -v

  backend-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/backend-api/package-lock.json
      - run: npm ci
        working-directory: apps/backend-api
      - run: npm test
        working-directory: apps/backend-api

  alert-testing-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check private packaging isolation
        run: python3 infrastructure/scripts/check-alert-testing-compose.py
      - name: Build worker and private UI/control images
        run: |
          docker build -t quakestrike-workers:ci-test -f workers/Dockerfile .
          docker build --build-arg BASE_IMAGE_TAG=ci-test -t quakestrike-alert-testing:ci-test -f apps/quakestrikeph-alert-testing/Dockerfile .
      - name: Probe packaged private services without provider credentials
        run: |
          docker compose -p quakestrike-data-ingestion-test -f infrastructure/compose.integration.yml up -d --wait postgres-test redis-test
          python3 infrastructure/scripts/smoke-alert-testing-package.py ci-test
      - name: Remove disposable package services
        if: always()
        run: docker compose -p quakestrike-data-ingestion-test -f infrastructure/compose.integration.yml --profile alert-testing-workflow down -v

  bulletin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check and build production Bulletin image
        run: docker build -t quakestrike-bulletin:test -f apps/quakestrikeph-bulletin/Dockerfile .
      - name: Verify production pages and assets
        run: |
          docker network create bulletin-test
          docker run -d --name bulletin-test --network bulletin-test --network-alias bulletin -p 127.0.0.1:4321:4321 -e API_TARGET=http://backend-api:3000 quakestrike-bulletin:test
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4321/ -o /tmp/bulletin.html && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4321/ -o /tmp/bulletin.html
          asset=$(python3 -c 'import re; print(re.search(r"(?:src|href)=\"(/_astro/[^\"]+)\"", open("/tmp/bulletin.html").read())[1])')
          curl --fail --silent --show-error "http://127.0.0.1:4321$asset" -o /dev/null
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Run Bulletin component and browser tests
        working-directory: apps/quakestrikeph-bulletin
        env:
          BULLETIN_URL: http://127.0.0.1:4321
        run: |
          npm install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test
      - name: Verify Traefik page and API routing
        run: |
          docker run -d --name backend-route-test --network bulletin-test --network-alias backend-api quakestrike-bulletin:test node -e 'require("http").createServer((q,s)=>{s.setHeader("Content-Type","application/json");s.end(JSON.stringify({testBackend:true}))}).listen(3000,"0.0.0.0")'
          docker run -d --name traefik-test --network bulletin-test -p 127.0.0.1:8080:80 -v "$GITHUB_WORKSPACE/infrastructure/traefik/backend.yml:/etc/traefik/backend.yml:ro" traefik:v3.7.13 --providers.file.filename=/etc/traefik/backend.yml --entrypoints.web.address=:80
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 -H 'Host: quakestrikeph.com' http://127.0.0.1:8080/ -o /tmp/routed-bulletin.html
          grep -q 'QuakeStrike' /tmp/routed-bulletin.html
          grep -q '/_astro/' /tmp/routed-bulletin.html
          curl --fail --silent --show-error -H 'Host: quakestrikeph.com' -H 'Content-Type: application/json' --data '{"limit":1}' http://127.0.0.1:8080/api/v1/earthquakes/search | python3 -c 'import json,sys; assert json.load(sys.stdin)["testBackend"] is True'
          for hostname in quakestrikeph.qzz.io unrelated.example quakestrikeph.com.unrelated.example; do
            test "$(curl --silent -o /dev/null -w '%{http_code}' -H "Host: $hostname" http://127.0.0.1:8080/)" = 404
            test "$(curl --silent -o /dev/null -w '%{http_code}' -H "Host: $hostname" http://127.0.0.1:8080/api/v1/earthquakes/search)" = 404
          done
      - name: Remove test container
        if: always()
        run: |
          docker rm -f traefik-test backend-route-test bulletin-test || true
          docker network rm bulletin-test || true

  deploy:
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: [workers, backend-unit, bulletin, alert-testing-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: production-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Join the deployment tailnet
        uses: tailscale/github-action@a392da0a182bba0e9613b6243ebd69529b1878aa # v4.1.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-deploy
          ping: ${{ vars.VPS_TAILSCALE_HOST }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Stop optional tools, back up, migrate, and deploy tested application
        env:
          DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.VPS_TAILSCALE_HOST }}
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$GITHUB_SHA'" < infrastructure/scripts/deploy-workers.sh
