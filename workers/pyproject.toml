[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quakestrike-workers"
version = "0.1.0"
description = "QuakeStrike PH background worker scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "celery[redis]>=5.5,<6",
    "jsonschema>=4.25,<5",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2,<3",
]

[project.scripts]
quakestrike = "quakestrike.cli:main"
quakestrike-beat = "quakestrike.scheduler.beat:main"
quakestrike-dispatcher = "quakestrike.scheduler.dispatcher:main"
quakestrike-ingestor = "quakestrike.data_ingestor.worker:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quakestrike"]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires an isolated PostgreSQL 16 database"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.uv]
default-groups = ["dev"]
